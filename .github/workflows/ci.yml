name: .NET CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  dotnet-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore collateral-appraisal-system-api.sln

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes
        continue-on-error: true

      - name: Build
        run: dotnet build collateral-appraisal-system-api.sln --configuration Release --no-restore

      # Unlike the Test step below, this one gates the job: a model that drifted from its migrations must not merge.
      - name: EF model drift
        run: dotnet test Tests/Unit/Shared.Tests/Shared.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ModelSnapshotDriftTests"

      - name: Test
        run: dotnet test collateral-appraisal-system-api.sln --no-restore --verbosity normal
        continue-on-error: true