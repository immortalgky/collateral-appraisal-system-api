<!DOCTYPE html>
<html lang="th">
<head>
<!-- PDF page-margin directives read by PuppeteerPdfRenderer: the summary forms use a
     narrower 5mm margin on all four sides instead of the 15mm default, so the wide tables gain
     usable width and the form starts near the paper edge. They MUST stay in this root, not in
     partials/summary-head — appraisal-book.html shares that partial and must keep the 15mm
     default.
     pdf-margin-x:5mm -->
<!-- pdf-margin-y:5mm -->
  <meta charset="UTF-8"/>
  <title>สรุปรายงานการประเมินราคาทรัพย์สิน – เครื่องจักร</title>
  <style>{{ include 'partials/summary-styles' }}
    /* One registration set per row, so each cell holds a single heading and its machines. The
       heading is bold rather than bulleted and the machines line up flush with it — the numbering
       already says which set they belong to, so an indent only cost width in a cell that is short
       of it. Sets are told apart by the table rule between rows, not by spacing. */
    .m-head { font-weight: 700; }
    /* The group's name, printed on the first row of a group when the form shows more than one, so
       a row says which group it belongs to. The group's subtotal row closes the group, so the name
       is not repeated on the rows in between. */
    .g-name { font-weight: 700; margin-bottom: 2px; }
    /* The set's total is labelled on the last line of the item cell while the figure itself sits
       in the ราคาประเมิน column, so it reads on one line across the row. Plain weight: the bold
       row is รวมมูลค่าเครื่องจักร at the foot of the table, and this must not compete with it. */
    .m-total { margin-top: 3px; }
    /* Only the cell holding that figure aligns to the bottom — every other cell in the table stays
       top-aligned (summary-styles sets vertical-align:top on all of them), so this is the one
       exception that puts the number on the same line as its label. */
    table.grid td.num.foot { vertical-align: bottom; }
    /* The attribute block sits straight under the full-width totals table here, so it lines up
       with that table's edge. The 18px indent in summary-styles is for the appraisal book, where
       the same class nests these attributes under each machine's own heading. */
    .machine-attrs { padding-left: 0; }
  </style>
</head>
<body>
{{ include 'partials/summary-machine-body' }}
</body>
</html>
