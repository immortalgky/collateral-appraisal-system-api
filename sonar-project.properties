# SonarCloud automatic analysis reads this file; there is no scanner step in .github/workflows/ci.yml.

sonar.projectKey=immortalgky_collateral-appraisal-system-api
sonar.organization=immortalgky

# EF Core writes these, not us. Every migration carries a *.Designer.cs holding a full snapshot of
# the model at that point, so each new migration is by construction ~1,200 lines that differ from the
# previous snapshot only where the model changed. The duplication detector reads that as thousands of
# copy-pasted lines and the density on new code is then a function of how many migrations a PR adds
# rather than of anything anyone wrote — a two-migration PR fails the gate on generated text alone.
#
# Duplication only. These files are still analysed for bugs and vulnerabilities; nothing is hidden.
sonar.cpd.exclusions=**/Migrations/*.Designer.cs,**/Migrations/*ModelSnapshot.cs,Database/Scripts/Maintenance/CreateMaintenanceAgentJobs.sql

# Vendored third-party code: CreateMaintenanceAgentJobs.sql embeds Ola Hallengren's Maintenance Solution
# (~10,000 lines of T-SQL, MIT) verbatim. It is run once by hand by the DBA, not by DbUp or the app, and we
# do not maintain it, so keep it out of analysis. Under automatic analysis sonar.exclusions did not keep it out of
# duplication detection (PR #592 failed the gate at 32.7%), so the file is also listed in sonar.cpd.exclusions above.
sonar.exclusions=Database/Scripts/Maintenance/CreateMaintenanceAgentJobs.sql
